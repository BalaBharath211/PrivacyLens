<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Privacy Dashboard Settings</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        h1, h2 { color: #333; }
        .setting { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .domain-list { list-style-type: none; padding: 0; }
        .domain-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
        .allow-btn { background-color: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .allow-btn:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <h1>Settings</h1>

    <div class="setting">
        <span>Enable Heuristic Engine (Self-Learning)</span>
        <label class="switch">
            <input type="checkbox" id="heuristic-toggle">
        </label>
    </div>

    <h2>Dynamically Blocked Domains</h2>
    <p>These are domains blocked by the heuristic engine. You can allow any domain that was incorrectly blocked (a "false positive").</p>
    <ul id="dynamic-domain-list" class="domain-list">
        </ul>

    <script src="settings.js"></script>
</body>
</html>
