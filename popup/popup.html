<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Lens</title>
  <style>
    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
      padding: 15px;
      width: 360px;
      background-color: #f8fafc;
      color: #1e293b;
      overflow-x: hidden;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    header h1 {
      display: flex;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: #16a34a;
    }

    header svg {
      margin-right: 8px;
    }

    /* Card styling */
    .card {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 15px;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 32px;
      font-weight: bold;
      color: #16a34a;
    }

    /* Button styling */
    .btn {
      display: block;
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
      transition: all 0.2s;
    }

    .btn.primary {
      background-color: #2563eb;
    }
    .btn.primary:hover {
      background-color: #1d4ed8;
    }

    .btn.danger {
      background-color: #dc2626;
    }
    .btn.danger:hover {
      background-color: #b91c1c;
    }

    #currentUrl {
      font-size: 14px;
      word-break: break-all;
      color: #475569;
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-top: 10px;
    }

    footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
    </style>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup-shell">
      <header class="topbar">
        <div class="brand">
          <img src="../icons/icon48.png" alt="">
          <div><span class="eyebrow">PRIVACY LENS</span><h1>Site protection</h1></div>
        </div>
        <button class="text-button" id="settingsBtn" type="button" title="Open settings">Settings</button>
      </header>

      <section class="site-strip" aria-live="polite">
        <span class="site-mark" aria-hidden="true"></span>
        <div class="site-copy"><span class="eyebrow">CURRENT SITE</span><strong id="siteDomain">Loading site...</strong></div>
        <span class="protection-state" id="siteState">Checking</span>
      </section>

      <section class="protection-panel" aria-label="Protection controls">
        <label class="switch-row" for="globalProtection">
          <span><strong>Global protection</strong><small>Known trackers and ads</small></span>
          <input id="globalProtection" type="checkbox">
        </label>
        <div class="control-divider"></div>
        <label class="switch-row" for="siteProtection">
          <span><strong>Protect this site</strong><small>Pause protection for this site</small></span>
          <input id="siteProtection" type="checkbox">
        </label>
        <button class="quiet-button" id="trustSite" type="button">Trust this site</button>
      </section>

      <section class="activity" aria-label="Request activity">
        <div class="section-heading"><h2>Recent activity</h2><span id="recentCount" class="page-count">0 retained requests</span></div>
        <p id="pageBlocked" class="page-count">0 PrivacyLens rule matches this page</p>
        <div id="trackerList" class="tracker-list" aria-live="polite">
          <p class="empty-state">Loading activity...</p>
        </div>
      </section>

      <section class="summary" aria-label="Request totals">
        <div><strong id="totalBlockedCount">0</strong><span>Total blocked</span></div>
        <div><strong id="totalDetectedCount">0</strong><span>Total detected</span></div>
      </section>

      <section id="trackerDetail" class="detail-panel" aria-live="polite" hidden>
        <button id="detailBack" class="back-button" type="button">Back to activity</button>
        <p class="eyebrow" id="detailCategory">TRACKER</p>
        <h2 id="detailName"></h2>
        <p class="detail-domain" id="detailDomain"></p>
        <dl>
          <div><dt>Company</dt><dd id="detailCompany">Unknown</dd></div>
          <div><dt>Purpose</dt><dd id="detailPurpose">Unknown</dd></div>
          <div><dt>Recent requests</dt><dd id="detailRequests">0</dd></div>
          <div><dt>Latest status</dt><dd id="detailStatus">ALLOWED</dd></div>
        </dl>
        <button id="allowTracker" class="action-button" type="button">Allow on this site</button>
        <button id="blockTracker" class="quiet-button" type="button">Block globally</button>
      </section>

      <p id="errorMessage" class="error-message" role="status" hidden></p>
    </main>
    <script type="module" src="popup.js"></script>
</body>
</html>
